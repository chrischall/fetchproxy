name: release-please

# Monorepo mode: linked-versions plugin keeps all 5 packages on the same
# version. release-please opens ONE release PR covering all sub-packages
# (separate-pull-requests: false) and creates ONE tag (no component
# prefix — include-component-in-tag: false).
#
# When the release PR merges, release-please-action creates a `v<NEXT>`
# tag using RELEASE_PAT. Tag push fires the existing release.yml which
# publishes each non-private sub-package to npm via Trusted Publisher
# OIDC.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
