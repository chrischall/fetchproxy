name: release-please

# Single-workflow monorepo release pipeline (canonical release-please
# shape, matching ofw-mcp).
#
# Job 1 (release-please): runs googleapis/release-please-action with
# linked-versions across all 5 sub-packages. Opens ONE combined release
# PR (separate-pull-requests: false). When that PR merges, the action
# creates a single `v<NEXT>` tag (include-component-in-tag: false).
#
# Job 2 (publish): gates on `tag_name` being set (meaning the release
# PR just merged). Checks out the tag, builds each non-private
# sub-package, publishes them to npm via Trusted Publisher OIDC,
# builds the Chrome extension zip, and attaches the zip to the
# GitHub Release release-please already authored.

on:
  push:
    branches: [main]
  # workflow_dispatch with an optional `republish_tag` input lets us
  # manually re-fire the publish job for an existing tag — useful when
  # an earlier publish failed (e.g. wrong Node version) and the tag is
  # already cut. Leave `republish_tag` blank for the regular path of
  # just running release-please-action to check for a new release PR.
  workflow_dispatch:
    inputs:
      republish_tag:
        description: 'Existing tag to re-publish (e.g. v0.5.0). Blank = skip publish.'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Lockstep cross-package deps: when release-please bumps the
      # umbrella version (and the `extra-files` entries propagate it to
      # every sub-package's `version` field), it does NOT touch
      # inter-package caret-range deps (e.g. bootstrap's
      # `"@fetchproxy/server": "^X.Y.Z"`). This step walks every
      # sub-package and rewrites those caret ranges to the new umbrella
      # version, then amends the release PR with the change. Without
      # this, the published tarballs would carry a stale `^X.Y.Z` and
      # downstream consumers would resolve to old versions of
      # cross-package deps.
      #
      # Uses RELEASE_PAT (not GITHUB_TOKEN) so the amend-commit fires
      # downstream CI / re-arming — keeping the release PR's CI status
      # current.
      - name: Checkout for cross-dep sync
        if: steps.release.outputs.pr
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Setup Node for cross-dep sync
        if: steps.release.outputs.pr
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Sync cross-package caret deps in the release PR
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          # Pass the raw JSON through and parse with `jq` inside `run:`.
          # Resolving `fromJSON(...).number` in the `env:` template above
          # would error at template-evaluation time on runs where the
          # action produced no PR output (most notably the post-release
          # PR merge run, where outputs.pr is empty). The `if:` filter
          # short-circuits the `run:` block but does NOT prevent `env:`
          # from being evaluated, so an empty-string fromJSON fails the
          # whole job. Observed:
          #   https://github.com/chrischall/fetchproxy/actions/runs/26384384708/job/77659773051
          PR_OUTPUT: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(printf '%s' "$PR_OUTPUT" | jq -r .number)
          PR_HEAD=$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)
          git fetch origin "$PR_HEAD"
          git checkout "$PR_HEAD"
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "Syncing cross-package @fetchproxy/* deps to ^${NEW_VERSION}"
          # Glob every workspace rather than a hardcoded list: a new package
          # (packages/cli was added in #151) must not silently miss the caret
          # sync and publish stale cross-dep ranges. The guard skips any
          # packages/* entry without a package.json.
          for pkg in packages/*; do
            [ -f "${pkg}/package.json" ] || continue
            node -e "
              const fs = require('fs');
              const file = '${pkg}/package.json';
              const j = JSON.parse(fs.readFileSync(file, 'utf8'));
              let changed = false;
              for (const key of ['dependencies', 'devDependencies', 'peerDependencies']) {
                if (!j[key]) continue;
                for (const dep of Object.keys(j[key])) {
                  if (dep.startsWith('@fetchproxy/') && j[key][dep] !== '^${NEW_VERSION}') {
                    j[key][dep] = '^${NEW_VERSION}';
                    changed = true;
                  }
                }
              }
              if (changed) fs.writeFileSync(file, JSON.stringify(j, null, 2) + '\n');
            "
          done
          if git diff --quiet; then
            echo "No cross-package dep updates needed."
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts
          git add -A
          git -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              -c user.name='github-actions[bot]' \
              commit -m "chore: sync cross-package @fetchproxy/* deps to ^${NEW_VERSION}"
          git push origin HEAD:"$PR_HEAD"

  publish:
    needs: release-please
    # Fire on either:
    #   - a fresh release (release-please-action just cut a tag), OR
    #   - a manual workflow_dispatch with `republish_tag` set to an
    #     existing tag (escape hatch for re-running publish on a tag
    #     whose original publish failed).
    if: |
      needs.release-please.outputs.release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.republish_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Prefer the release-please-emitted tag on the auto path; fall
          # back to the manually-supplied republish_tag on the dispatch
          # path.
          ref: ${{ needs.release-please.outputs.tag_name || inputs.republish_tag }}

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # Strip `always-auth` from .npmrc (deprecated in npm 11). Keep
      # the `_authToken=${NODE_AUTH_TOKEN}` line setup-node wrote:
      # NODE_AUTH_TOKEN is unset, so the placeholder is empty, and
      # `npm publish --provenance` then takes the OIDC path against
      # the package's Trusted Publisher trust on npm. Stripping the
      # `_authToken` line breaks that — confirmed by mirroring the
      # working pattern across compass-mcp, honeybook-mcp,
      # opentable-mcp.
      - name: Strip always-auth from .npmrc
        run: sed -i '/always-auth/d' "$NPM_CONFIG_USERCONFIG"

      - run: npm ci

      # The umbrella VERSION = the release tag (release-please picks it
      # off the root package). Used for the extension-zip filename and
      # the GitHub Release asset upload. Sub-package npm publishes read
      # their OWN package.json instead — release-please bumps packages
      # independently (only the ones whose conventional commits warrant
      # it), so the umbrella tag does NOT track every sub-package's
      # version 1:1.
      - name: Set umbrella VERSION env
        run: |
          TAG="${{ needs.release-please.outputs.tag_name || inputs.republish_tag }}"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # Build TS packages in dependency order: protocol → server →
      # bootstrap → extension-core. extension-chrome's bundle is built
      # separately below (needs protocol/dist on disk first).
      - name: Build packages
        run: npm run build --workspace=@fetchproxy/protocol --workspace=@fetchproxy/server --workspace=@fetchproxy/bootstrap --workspace=@fetchproxy/extension-core --workspace=@fetchproxy/test-helpers

      # Publish each non-private package at the version pinned in its
      # OWN package.json. release-please bumps packages independently,
      # so reading a single shared VERSION (from protocol's manifest)
      # caused server/bootstrap publishes to silently skip whenever
      # protocol didn't move. Idempotent — already-published versions
      # are skipped so re-runs are safe.
      - name: Publish @fetchproxy/protocol to npm
        run: |
          PKG_VERSION=$(node -p "require('./packages/protocol/package.json').version")
          PUBLISHED=$(npm view "@fetchproxy/protocol@${PKG_VERSION}" version 2>/dev/null || true)
          if [ "$PUBLISHED" = "$PKG_VERSION" ]; then
            echo "npm already has @fetchproxy/protocol@${PKG_VERSION} — skipping."
            exit 0
          fi
          npm publish --workspace=@fetchproxy/protocol --access=public --provenance

      - name: Publish @fetchproxy/server to npm
        run: |
          PKG_VERSION=$(node -p "require('./packages/server/package.json').version")
          PUBLISHED=$(npm view "@fetchproxy/server@${PKG_VERSION}" version 2>/dev/null || true)
          if [ "$PUBLISHED" = "$PKG_VERSION" ]; then
            echo "npm already has @fetchproxy/server@${PKG_VERSION} — skipping."
            exit 0
          fi
          npm publish --workspace=@fetchproxy/server --access=public --provenance

      - name: Publish @fetchproxy/bootstrap to npm
        run: |
          PKG_VERSION=$(node -p "require('./packages/bootstrap/package.json').version")
          PUBLISHED=$(npm view "@fetchproxy/bootstrap@${PKG_VERSION}" version 2>/dev/null || true)
          if [ "$PUBLISHED" = "$PKG_VERSION" ]; then
            echo "npm already has @fetchproxy/bootstrap@${PKG_VERSION} — skipping."
            exit 0
          fi
          npm publish --workspace=@fetchproxy/bootstrap --access=public --provenance

      - name: Publish @fetchproxy/test-helpers to npm
        run: |
          PKG_VERSION=$(node -p "require('./packages/test-helpers/package.json').version")
          PUBLISHED=$(npm view "@fetchproxy/test-helpers@${PKG_VERSION}" version 2>/dev/null || true)
          if [ "$PUBLISHED" = "$PKG_VERSION" ]; then
            echo "npm already has @fetchproxy/test-helpers@${PKG_VERSION} — skipping."
            exit 0
          fi
          npm publish --workspace=@fetchproxy/test-helpers --access=public --provenance

      # Build & zip the Chrome extension for sideload distribution
      # before the Chrome Web Store review of each release.
      - name: Build & package Chrome extension
        working-directory: packages/extension-chrome
        run: |
          npx tsx build.ts
          cd dist
          zip -r "../../../fetchproxy-extension-${VERSION}.zip" .
          ls -la "../../../fetchproxy-extension-${VERSION}.zip"

      # release-please-action already created the GitHub Release with
      # the CHANGELOG body. Attach the extension zip via gh release
      # upload --clobber so re-runs overwrite.
      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name || inputs.republish_tag }}" \
            "fetchproxy-extension-${VERSION}.zip" \
            --clobber
