name: release-please

# Thin stub: release-please itself now runs in chrischall/workflows'
# reusable-release-please.yml. What stays in THIS file is everything that
# depends on this repo's identity or on this monorepo's shape:
#
#   * the PUBLISH job — npm trusted publishing binds provenance to this
#     repository's workflow identity via OIDC, so moving it would break
#     provenance for all five @fetchproxy/* packages;
#   * the CROSS-PACKAGE CARET SYNC — release-please bumps each sub-package's
#     `version` through `extra-files` but never the inter-package
#     `@fetchproxy/*: ^X.Y.Z` ranges, and that fix-up is peculiar to this
#     lockstep monorepo, so it is not something the shared workflow knows how
#     to do. It runs as its own job here, after the reusable workflow has
#     opened (and credited) the release PR.
#
# WHY THIS WAS CONVERTED AT ALL. `release-please.yml` was copied into 81
# repos and drifted into 18 variants, so a fix to release behaviour was an
# 81-repo sweep. On 2026-09-14 a transient GitHub API error lost
# release-please's `release_created` output in creditkarma-mcp, homes-mcp and
# onehome-mcp AFTER each had already cut its tag and GitHub Release. Publish
# is gated on that flag, so it skipped — and re-running does not help,
# because release-please then correctly reports the release already exists
# and sets the flag false again. Tag cut, Release published, npm empty, no
# path to finish it (chrischall/workflows#283).
#
# fetchproxy is where the `republish_tag` escape hatch below was invented;
# the 81 copies never got it, because a fix in one repo does not reach the
# others. Calling the shared workflow is how it stops being this repo's
# private fix.
#
# A green tag still does not mean a green publish: the two jobs are
# independent. Confirm with `npm view @fetchproxy/server version`.

on:
  push:
    branches: [main]
  # `republish_tag` re-fires the publish job for a tag that ALREADY EXISTS —
  # for a release whose tag and GitHub Release were cut but whose publish
  # never ran. Blank on the ordinary path. It lives here rather than in the
  # reusable workflow because a called workflow cannot declare its caller's
  # triggers.
  workflow_dispatch:
    inputs:
      republish_tag:
        description: 'Existing tag to re-publish (e.g. v0.5.0). Blank = skip publish.'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: chrischall/workflows/.github/workflows/reusable-release-please.yml@main
    with:
      republish_tag: ${{ inputs.republish_tag }}
    secrets:
      release_pat: ${{ secrets.RELEASE_PAT }}

  # Lockstep cross-package deps: when release-please bumps the umbrella
  # version (and the `extra-files` entries propagate it to every
  # sub-package's `version` field), it does NOT touch inter-package
  # caret-range deps (e.g. bootstrap's `"@fetchproxy/server": "^X.Y.Z"`).
  # This job walks every workspace and rewrites those caret ranges to the new
  # umbrella version, then amends the release PR with the change. Without it,
  # the published tarballs would carry a stale `^X.Y.Z` and downstream
  # consumers would resolve to old versions of cross-package deps.
  #
  # It used to be extra steps inside the release-please job, which is now the
  # reusable workflow's; as its own job it runs strictly AFTER that workflow
  # finishes, so it lands on top of the branch release-please force-pushed
  # and the contributor-credit amend the reusable workflow applies to it —
  # rather than racing either.
  #
  # `publish` deliberately does NOT depend on this job: a skipped `needs`
  # skips its dependents, and this one is skipped on exactly the run that
  # publishes (a release run touches no PR). Nothing here touches the tag
  # being published anyway.
  #
  # Uses RELEASE_PAT (not GITHUB_TOKEN) so the amend-commit fires downstream
  # CI / re-arming — keeping the release PR's CI status current.
  sync-cross-deps:
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout for cross-dep sync
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Setup Node for cross-dep sync
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Sync cross-package caret deps in the release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          # Pass the raw JSON through and parse with `jq` inside `run:`.
          # Resolving `fromJSON(...).number` in the `env:` template above
          # would error at template-evaluation time on runs where the
          # reusable workflow produced no PR output (most notably the
          # post-release PR merge run, where outputs.pr is empty). The job's
          # `if:` filter short-circuits the `run:` block but does NOT prevent
          # `env:` from being evaluated, so an empty-string fromJSON fails
          # the whole job. Observed:
          #   https://github.com/chrischall/fetchproxy/actions/runs/26384384708/job/77659773051
          PR_OUTPUT: ${{ needs.release-please.outputs.pr }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(printf '%s' "$PR_OUTPUT" | jq -r .number)
          PR_HEAD=$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)
          git fetch origin "$PR_HEAD"
          git checkout "$PR_HEAD"
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "Syncing cross-package @fetchproxy/* deps to ^${NEW_VERSION}"
          # Glob every workspace rather than a hardcoded list: a new package
          # (packages/cli was added in #151) must not silently miss the caret
          # sync and publish stale cross-dep ranges. The guard skips any
          # packages/* entry without a package.json.
          for pkg in packages/*; do
            [ -f "${pkg}/package.json" ] || continue
            node -e "
              const fs = require('fs');
              const file = '${pkg}/package.json';
              const j = JSON.parse(fs.readFileSync(file, 'utf8'));
              let changed = false;
              for (const key of ['dependencies', 'devDependencies', 'peerDependencies']) {
                if (!j[key]) continue;
                for (const dep of Object.keys(j[key])) {
                  if (dep.startsWith('@fetchproxy/') && j[key][dep] !== '^${NEW_VERSION}') {
                    j[key][dep] = '^${NEW_VERSION}';
                    changed = true;
                  }
                }
              }
              if (changed) fs.writeFileSync(file, JSON.stringify(j, null, 2) + '\n');
            "
          done
          if git diff --quiet; then
            echo "No cross-package dep updates needed."
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts
          git add -A
          git -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              -c user.name='github-actions[bot]' \
              commit -m "chore: sync cross-package @fetchproxy/* deps to ^${NEW_VERSION}"
          git push origin HEAD:"$PR_HEAD"

  publish:
    needs: release-please
    # `publish`, NOT `release_created`: the latter is release-please's own
    # flag and is false on a republish, which is the one run that exists to
    # publish. The reusable workflow folds both paths — a fresh release and a
    # `republish_tag` dispatch of an existing tag — into this one output.
    #
    # Bound to main: a `republish_tag` dispatch runs THIS file as it exists on
    # the dispatching ref, so without a binding a branch could rewrite the
    # job and publish under this workflow's Trusted-Publisher identity. The
    # `npm-publish` environment (deployment branches: main only, configured
    # on GitHub and named in each package's npm Trusted Publisher) is what
    # enforces it; the `github.ref` guard makes a dispatch from any other
    # ref skip visibly. A republish is therefore dispatched from main — the
    # tag it publishes is still whatever `republish_tag` names. Guarded by
    # tests/publish-jobs-are-bound-to-main.test.ts.
    if: needs.release-please.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    environment: npm-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # `tag`, not `tag_name`: resolved ONCE for both paths by the
          # reusable workflow, and `tag_name` is empty on a republish where
          # only the dispatch input names the tag.
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # Strip `always-auth` from .npmrc (deprecated in npm 11). Keep
      # the `_authToken=${NODE_AUTH_TOKEN}` line setup-node wrote:
      # NODE_AUTH_TOKEN is unset, so the placeholder is empty, and
      # `npm publish --provenance` then takes the OIDC path against
      # the package's Trusted Publisher trust on npm. Stripping the
      # `_authToken` line breaks that — confirmed by mirroring the
      # working pattern across compass-mcp, honeybook-mcp,
      # opentable-mcp.
      - name: Strip always-auth from .npmrc
        run: sed -i '/always-auth/d' "$NPM_CONFIG_USERCONFIG"

      # `--ignore-scripts`: this job holds the OIDC publish identity for
      # every @fetchproxy/* package, so a lifecycle script from any
      # transitive dependency would execute beside the thing that can
      # publish. The lockfile carries esbuild's platform binary as an
      # optional package, so the build below does not need esbuild's
      # postinstall — verified with a clean
      # `npm ci --ignore-scripts && npm run build`.
      - run: npm ci --ignore-scripts

      # Build every workspace (protocol, server, bootstrap, cli,
      # test-helpers). The browser extension is released from
      # nullnet-app/contextmint-bridge, not from here.
      - name: Build packages
        # Root build (all workspaces) so every publishable package's dist/ is
        # present — a hand-listed --workspace set silently skipped @fetchproxy/cli.
        run: npm run build

      # Publish each non-private package at the version pinned in its
      # OWN package.json. release-please bumps packages independently,
      # so reading a single shared VERSION (from protocol's manifest)
      # caused server/bootstrap publishes to silently skip whenever
      # protocol didn't move. Idempotent — already-published versions
      # are skipped so re-runs are safe.
      - name: Publish @fetchproxy/protocol to npm
        run: |
          PKG_VERSION=$(node -p "require('./packages/protocol/package.json').version")
          PUBLISHED=$(npm view "@fetchproxy/protocol@${PKG_VERSION}" version 2>/dev/null || true)
          if [ "$PUBLISHED" = "$PKG_VERSION" ]; then
            echo "npm already has @fetchproxy/protocol@${PKG_VERSION} — skipping."
            exit 0
          fi
          npm publish --workspace=@fetchproxy/protocol --access=public --provenance

      - name: Publish @fetchproxy/server to npm
        run: |
          PKG_VERSION=$(node -p "require('./packages/server/package.json').version")
          PUBLISHED=$(npm view "@fetchproxy/server@${PKG_VERSION}" version 2>/dev/null || true)
          if [ "$PUBLISHED" = "$PKG_VERSION" ]; then
            echo "npm already has @fetchproxy/server@${PKG_VERSION} — skipping."
            exit 0
          fi
          npm publish --workspace=@fetchproxy/server --access=public --provenance

      - name: Publish @fetchproxy/bootstrap to npm
        run: |
          PKG_VERSION=$(node -p "require('./packages/bootstrap/package.json').version")
          PUBLISHED=$(npm view "@fetchproxy/bootstrap@${PKG_VERSION}" version 2>/dev/null || true)
          if [ "$PUBLISHED" = "$PKG_VERSION" ]; then
            echo "npm already has @fetchproxy/bootstrap@${PKG_VERSION} — skipping."
            exit 0
          fi
          npm publish --workspace=@fetchproxy/bootstrap --access=public --provenance

      - name: Publish @fetchproxy/test-helpers to npm
        run: |
          PKG_VERSION=$(node -p "require('./packages/test-helpers/package.json').version")
          PUBLISHED=$(npm view "@fetchproxy/test-helpers@${PKG_VERSION}" version 2>/dev/null || true)
          if [ "$PUBLISHED" = "$PKG_VERSION" ]; then
            echo "npm already has @fetchproxy/test-helpers@${PKG_VERSION} — skipping."
            exit 0
          fi
          npm publish --workspace=@fetchproxy/test-helpers --access=public --provenance

      # Published last so its @fetchproxy/* runtime deps (protocol, server,
      # bootstrap) are already live. Needs an npm Trusted Publisher configured
      # for @fetchproxy/cli, same as the other packages, or --provenance OIDC
      # fails ENEEDAUTH.
      - name: Publish @fetchproxy/cli to npm
        run: |
          PKG_VERSION=$(node -p "require('./packages/cli/package.json').version")
          PUBLISHED=$(npm view "@fetchproxy/cli@${PKG_VERSION}" version 2>/dev/null || true)
          if [ "$PUBLISHED" = "$PKG_VERSION" ]; then
            echo "npm already has @fetchproxy/cli@${PKG_VERSION} — skipping."
            exit 0
          fi
          npm publish --workspace=@fetchproxy/cli --access=public --provenance
