name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Clean up the .npmrc setup-node generated.
      #
      # setup-node with `registry-url:` writes two lines:
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      #   always-auth=true
      #
      # We don't pass `NPM_TOKEN` because we publish via npm Trusted
      # Publisher OIDC (provenance below). But when `NPM_TOKEN` is
      # absent, GitHub Actions masks `NODE_AUTH_TOKEN` with the
      # placeholder `XXXXX-XXXXX-XXXXX-XXXXX`, and npm tries to use
      # that placeholder as a static auth token before falling through
      # to OIDC. The registry rejects the bogus token with a
      # privacy-preserving 404 and never tries OIDC.
      #
      # Strip both lines so npm has no static auth at all — OIDC is
      # then the only path npm publish can take, and Trusted Publisher
      # works as designed.
      - name: Strip stale npm auth from .npmrc
        run: |
          sed -i '/always-auth/d' "$NPM_CONFIG_USERCONFIG"
          sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          echo "----- final .npmrc -----"
          cat "$NPM_CONFIG_USERCONFIG"
          echo "------------------------"

      - run: npm ci

      - name: Extract version (from tag)
        run: |
          # ${GITHUB_REF_NAME} is e.g. "v0.2.1" — strip the leading "v".
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${TAG_VERSION}" >> "$GITHUB_ENV"

      # Sanity check: the published package versions should match the
      # tag. The Tag & Bump workflow keeps them in sync, but a manually
      # pushed tag could drift, so we fail fast here rather than ship
      # a mismatched version pair.
      - name: Verify package versions match tag
        run: |
          PROTOCOL=$(node -p "require('./packages/protocol/package.json').version")
          SERVER=$(node -p "require('./packages/server/package.json').version")
          BOOTSTRAP=$(node -p "require('./packages/bootstrap/package.json').version")
          EXT_CORE=$(node -p "require('./packages/extension-core/package.json').version")
          EXT_CHROME=$(node -p "require('./packages/extension-chrome/package.json').version")
          DRIFT=""
          [ "$PROTOCOL" != "$VERSION" ]   && DRIFT="$DRIFT protocol=$PROTOCOL"
          [ "$SERVER" != "$VERSION" ]     && DRIFT="$DRIFT server=$SERVER"
          [ "$BOOTSTRAP" != "$VERSION" ]  && DRIFT="$DRIFT bootstrap=$BOOTSTRAP"
          [ "$EXT_CORE" != "$VERSION" ]   && DRIFT="$DRIFT extension-core=$EXT_CORE"
          [ "$EXT_CHROME" != "$VERSION" ] && DRIFT="$DRIFT extension-chrome=$EXT_CHROME"
          if [ -n "$DRIFT" ]; then
            echo "Tag is v${VERSION} but packages drifted:$DRIFT" >&2
            echo "Bump versions to match the tag, or re-tag." >&2
            exit 1
          fi

      # Build the TS packages in dependency order: protocol → server →
      # bootstrap → extension-core. extension-chrome's esbuild bundle is
      # produced separately further down (it needs protocol/dist on disk
      # first).
      - name: Build packages
        run: npm run build --workspace=@fetchproxy/protocol --workspace=@fetchproxy/server --workspace=@fetchproxy/bootstrap --workspace=@fetchproxy/extension-core

      # ─── npm publish: @fetchproxy/protocol ───
      # Publish protocol first so the server's `^${VERSION}` peer is
      # resolvable when consumers install both. Idempotent: skip if
      # this version is already on the registry so re-runs are safe.
      - name: Publish @fetchproxy/protocol to npm
        run: |
          PUBLISHED=$(npm view "@fetchproxy/protocol@${VERSION}" version 2>/dev/null || true)
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "npm already has @fetchproxy/protocol@${VERSION} — skipping."
            exit 0
          fi
          npm publish --workspace=@fetchproxy/protocol --access=public --provenance

      # ─── npm publish: @fetchproxy/server ───
      - name: Publish @fetchproxy/server to npm
        run: |
          PUBLISHED=$(npm view "@fetchproxy/server@${VERSION}" version 2>/dev/null || true)
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "npm already has @fetchproxy/server@${VERSION} — skipping."
            exit 0
          fi
          npm publish --workspace=@fetchproxy/server --access=public --provenance

      # ─── npm publish: @fetchproxy/bootstrap ───
      # Publishes after server so the helper's peer ranges resolve.
      - name: Publish @fetchproxy/bootstrap to npm
        run: |
          PUBLISHED=$(npm view "@fetchproxy/bootstrap@${VERSION}" version 2>/dev/null || true)
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "npm already has @fetchproxy/bootstrap@${VERSION} — skipping."
            exit 0
          fi
          npm publish --workspace=@fetchproxy/bootstrap --access=public --provenance

      # ─── Chrome extension bundle ───
      # Build the unpacked extension and zip it for distribution. The
      # zip is what users sideload during testing / before the Chrome
      # Web Store reviews each release.
      - name: Build & package Chrome extension
        working-directory: packages/extension-chrome
        run: |
          npx tsx build.ts
          cd dist
          zip -r "../../../fetchproxy-extension-${VERSION}.zip" .
          ls -la "../../../fetchproxy-extension-${VERSION}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: |
            fetchproxy-extension-${{ env.VERSION }}.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
