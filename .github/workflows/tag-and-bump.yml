name: Tag & Bump

on:
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  tag-and-bump:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          # PAT required — GITHUB_TOKEN pushes don't trigger other workflows
          token: ${{ secrets.RELEASE_PAT }}

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Tag the current commit with the current version. All four
      # workspace packages share a single version (kept in lockstep by
      # this workflow), so reading any one of them as the canonical
      # version is fine — we use protocol since it's the base dep.
      - name: Tag current version
        run: |
          CURRENT=$(node -p "require('./packages/protocol/package.json').version")
          git tag "v${CURRENT}"
          echo "TAGGED_VERSION=${CURRENT}" >> "$GITHUB_ENV"

      # Bump patch across every workspace atomically. `npm version
      # patch --workspaces` walks the workspaces and bumps each
      # package.json + lockfile in one go without creating a git tag.
      # We also bump the root package.json by hand to keep it visible
      # (it's `private: true` so it never publishes).
      - name: Bump patch across all workspaces
        run: |
          npm version patch --workspaces --no-git-tag-version
          NEXT=$(node -p "require('./packages/protocol/package.json').version")
          echo "NEXT_VERSION=${NEXT}" >> "$GITHUB_ENV"

          # The server depends on `@fetchproxy/protocol` via a caret
          # range — bump that to the new version too so a fresh install
          # picks up the matching protocol release. Same for the
          # private extension-* packages, which use either a caret or
          # a literal "*" (which we leave alone).
          node -e "
            const fs = require('fs');
            const next = '${NEXT}';
            const files = [
              'packages/server/package.json',
              'packages/extension-core/package.json',
              'packages/extension-chrome/package.json',
            ];
            for (const f of files) {
              const o = JSON.parse(fs.readFileSync(f, 'utf8'));
              for (const key of ['dependencies', 'devDependencies', 'peerDependencies']) {
                if (!o[key]) continue;
                for (const dep of Object.keys(o[key])) {
                  if (!dep.startsWith('@fetchproxy/')) continue;
                  if (o[key][dep] === '*') continue; // leave wildcards alone
                  o[key][dep] = '^' + next;
                }
              }
              fs.writeFileSync(f, JSON.stringify(o, null, 2) + '\n');
            }
          "

          # Refresh the lockfile so the new internal dep ranges are
          # captured. `--package-lock-only` avoids touching node_modules.
          npm install --package-lock-only

          # The Chrome extension's manifest.json carries its own version
          # field (MV3 requirement). Keep it in lockstep with the
          # workspace versions — release.yml reads it for the extension
          # zip artifact name.
          node -e "
            const fs = require('fs');
            const next = '${NEXT}';
            const path = 'packages/extension-chrome/manifest.json';
            const m = JSON.parse(fs.readFileSync(path, 'utf8'));
            m.version = next;
            fs.writeFileSync(path, JSON.stringify(m, null, 2) + '\n');
          "

      - name: Rebuild
        # Build TS packages first (protocol → server → extension-core),
        # then the Chrome extension. extension-chrome's esbuild bundles
        # via the workspace symlink and needs protocol's dist/ on disk.
        run: |
          npm run build --workspace=@fetchproxy/protocol --workspace=@fetchproxy/server --workspace=@fetchproxy/extension-core
          npm run build --workspace=@fetchproxy/extension-chrome

      - name: Commit and push
        run: |
          git add -A
          git commit -m "chore: bump version to v${NEXT_VERSION}"
          git push origin main
          git push origin "v${TAGGED_VERSION}"
