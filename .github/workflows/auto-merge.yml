name: Auto-merge PRs

# Thin stub — the pipeline lives in chrischall/workflows.
# pull_request_target so dependabot PRs can arm; PR code is never executed.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, labeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  arm:
    # SHA-pinned rather than `@main`: a push to chrischall/workflows would
    # otherwise rewrite what runs in this repo with no PR here. The four callers
    # (ci, auto-merge, claude, pr-auto-review) move together.
    uses: chrischall/workflows/.github/workflows/reusable-auto-merge.yml@dddbfd48c301af41d893b1087da3e569d2573e7e # main
    secrets:
      release_pat: ${{ secrets.RELEASE_PAT }}
