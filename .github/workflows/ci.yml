name: CI

on:
  pull_request:
    # `labeled` so arming ready-to-merge / release-ready triggers the deferred run.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest
    # CI is the LAST gate, not a parallel cost:
    #   - normal (human) PRs: CI runs only once auto-review passes and arms
    #     `ready-to-merge` — review findings get fixed without burning CI
    #     runs; the label event fires the run, and pushes to an armed PR
    #     re-run via synchronize (label still present).
    #   - release-please PRs: deferred to the `release-ready` ship signal.
    #   - BOT-authored PRs (dependabot): CI on EVERY event, unconditionally —
    #     a label event must not gate them (curtaincall review #86: the
    #     labeled-guard would have skipped a bot PR's run on any label touch) —
    #     bots never receive auto-review, so they'd otherwise merge with CI
    #     skipped (native auto-merge treats a skipped required check as
    #     satisfied).
    #   - workflow_call and push runs (no pull_request context) fall through
    #     unharmed.
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.type != 'User' ||
      (
        (github.event.action != 'labeled' || github.event.label.name == 'release-ready' || github.event.label.name == 'ready-to-merge') &&
        (
          (startsWith(github.event.pull_request.head.ref, 'release-please--') && contains(github.event.pull_request.labels.*.name, 'release-ready')) ||
          (!startsWith(github.event.pull_request.head.ref, 'release-please--') && contains(github.event.pull_request.labels.*.name, 'ready-to-merge'))
        )
      )
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm

      # `npm ci` from the root installs every workspace at once (protocol,
      # server, extension-core, extension-chrome) thanks to the workspaces
      # field in the root package.json.
      - run: npm ci

      # Build the TS workspaces before tests + typecheck. `@fetchproxy/protocol`'s
      # `exports` field resolves to `./dist/index.js`, so `server` and
      # `extension-core` need dist/ on disk to import it during vitest.
      - name: Build TS workspaces
        run: npm run build --workspace=@fetchproxy/protocol --workspace=@fetchproxy/server --workspace=@fetchproxy/extension-core --workspace=@fetchproxy/test-helpers

      - name: Test (full monorepo via vitest)
        run: npm test

      # The TS workspace build step above already typechecks via `tsc -b`
      # — a separate --noEmit pass would be redundant (and noEmit is
      # incompatible with --build per TS6369). extension-chrome is
      # esbuild-bundled below; if it has type errors, esbuild surfaces
      # them.

      # Build the Chrome extension to confirm bundling succeeds and the
      # resulting dist/ has the expected manifest + entry points.
      - name: Build Chrome extension
        working-directory: packages/extension-chrome
        run: |
          npx tsx build.ts
          test -f dist/manifest.json
          test -f dist/background.js
          test -f dist/content.js
          test -f dist/popup.js
