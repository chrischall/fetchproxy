name: Claude Code

# Thin stub — the job lives in chrischall/workflows.
#
# Ad-hoc dispatch: @claude mentions in issues, PR review threads, or issue
# comments. Automated PR review lives in pr-auto-review.yml; this workflow is
# the manual escape hatch, and the only review path available for fork PRs.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    # SHA-pinned rather than `@main`: a push to chrischall/workflows would
    # otherwise rewrite what runs in this repo with no PR here. The four callers
    # (ci, auto-merge, claude, pr-auto-review) move together.
    uses: chrischall/workflows/.github/workflows/reusable-claude.yml@dddbfd48c301af41d893b1087da3e569d2573e7e # main
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
