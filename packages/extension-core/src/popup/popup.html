<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Transporter</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        min-width: 380px;
        margin: 0;
        padding: 12px;
        font-size: 14px;
      }
      h3 { font-size: 16px; margin: 0 0 12px; }
      .pair-code {
        font-size: 28px;
        font-weight: bold;
        text-align: center;
        margin: 14px 0;
        letter-spacing: 3px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .warn {
        color: #b91c1c;
        padding: 8px;
        background: #fef2f2;
        border: 1px solid #fca5a5;
        border-radius: 4px;
      }
      .hint { color: #6b7280; font-size: 12px; }
      .btn-row {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 12px;
      }
      button { padding: 8px 16px; cursor: pointer; border-radius: 4px; font-size: 14px; }
      button[data-action="cancel"] { background: #eee; border: 1px solid #ccc; }
      button[data-action="approve"] { background: #2563eb; color: white; border: 1px solid #2563eb; }
      dl { margin: 0; }
      dt { font-weight: bold; color: #374151; }
      dd { margin: 0 0 8px 12px; color: #111; }
      ul { padding-left: 20px; margin: 8px 0; }
      li { padding: 2px 0; }
      /* 0.4.2: trusted-MCPs list with inline revoke button. */
      ul.trusted-list { list-style: none; padding-left: 0; }
      li.trusted-entry {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 0;
        border-bottom: 1px solid #f3f4f6;
      }
      li.trusted-entry:last-child { border-bottom: none; }
      .trusted-label { flex: 1; }
      button[data-action="revoke"] {
        background: transparent;
        border: 1px solid #e5e7eb;
        color: #6b7280;
        padding: 2px 8px;
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
        border-radius: 4px;
      }
      button[data-action="revoke"]:hover {
        background: #fef2f2;
        color: #b91c1c;
        border-color: #fca5a5;
      }
    </style>
  </head>
  <body>
    <div id="root">Loading…</div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
